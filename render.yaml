services:
  # Backend Express REST API
  - type: web
    name: daymark-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: daymark-db
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: daymark-db
    databaseName: daymark
    user: daymark_user
    plan: free
